# Invoice settings and business text (docs/BRD-cart-invoice.md section 8.5).
# Wording and spacing are copied from Printevr's own invoice on purpose, including
# "Recieved" on part-paid invoices (decision D3). `**...**` marks bold text.

bill_no_start: 19
# GST rates staff pick from on a "With GST billing" invoice. This list is the only place
# they are defined: the cart's GST Rate dropdown (via GET /api/invoice-settings), the tax
# calculation and the PDF's tax rows all read it. The dropdown shows them in this order.
# Each component is computed on the invoice total and rounded to paise separately; the
# PDF prints one row per component, "{name} @ {rate}%". Rates are percentages.
# Keys are stored with saved invoices, so don't reuse a key for a different rate.
gst_options:
  - key: gst_5
    label: "5% GST"
    components: [{ name: GST, rate: 5 }]
  - key: gst_12
    label: "12% GST"
    components: [{ name: GST, rate: 12 }]
  - key: gst_18
    label: "18% GST"
    components: [{ name: GST, rate: 18 }]
  - key: cgst_sgst_9_9
    label: "9% CGST + 9% SGST/UTGST"
    components: [{ name: CGST, rate: 9 }, { name: SGST/UTGST, rate: 9 }]
advance_pct: 80
pad_single_digit_unit_price: true
filename: "Invoice_{bill_no}_{business}_{status}.pdf"
status_labels: { unpaid: Unpaid, part_paid: Part-paid, paid: Paid }
# Printed under Bill No on page 1 as "Salesperson  :  <name typed in the cart>".
salesperson_label: "Salesperson"
# Every new invoice and every recorded payment is emailed here with its PDF. Sending needs
# SMTP_PASSWORD (a Gmail app password for SMTP_USER, which defaults to this address).
# {bill_no}, {business}, {status} and {salesperson} are filled in in the subjects and intros.
# The body lists the salesperson, the sale and its totals under `labels`, as HTML with a
# plain-text copy. Remove this block to stop the emails.
email:
  to: printevrdesk@gmail.com
  subject_new: "Invoice #{bill_no} – {business} – by {salesperson}"
  subject_payment: "Payment recorded · Invoice #{bill_no} – {business} – {status}"
  intro_new: "New invoice {bill_no} for {business}."
  intro_payment: "A payment was recorded on invoice {bill_no} for {business}. It is now {status}."
  status_labels: { unpaid: Unpaid, part_paid: Part-paid, paid: Paid in Full }
  labels:
    generated_by: "Generated by"
    customer: "Customer"
    bill_no: "Bill No"
    invoice_date: "Invoice date"
    items: "Items"
    item: "Item"
    quantity: "Qty"
    unit_price: "Unit price"
    subtotal: "Subtotal"
    total: "Total amount"
    payable: "Payable (incl. GST)"
    status: "Payment status"
    received: "Amount received"
    pending: "Amount pending"
    attached: "The invoice PDF is attached."
    unknown_salesperson: "Not recorded"
    currency: "Rs. "

unit_plurals: { box: boxes, bag: bags, card: cards, roll: rolls, sheet: sheets, label: labels, piece: pcs, pc: pcs, "sq ft": "sq ft" }
from_lines:
  - "#Plot no - 1795 2nd Floor,"
  - "Hallo Mazra 160002"
  - "Chandigarh"
  - "Ph- 6239645912, 7696771179"
payment_terms:
  title: "PAYMENT TERMS     ({billing_label})"
  billing_labels: { without_gst: "WITHOUT GST BILLING", with_gst: "WITH GST BILLING" }
  total: "**Total Amount:- Rs. {payable}/-**"
  advance: "**{advance_pct}% amount pending (before printing & after sample & final confirmation):-  {advance}/-**"
  received: "Recieved Amount:- Rs. {amount}/- ({date})"
  pending: "Amount Pending (out of {advance_pct}%) :- {advance}/-  (-)  {applied}/-  =  **{pending}/-**"
  balance: "{balance_pct}% Amount:- Rs. {balance}/- (Before Dispatching the Order)"
  balance_after_excess: "{balance_pct}% Amount:- Rs. {balance}/-  (-)  {excess}/-  =  **{balance_due}/-** (Before Dispatching the Order)"
  paid_in_full: "**Payment Status:- PAID IN FULL**"
  # Paid in full: the 80% / 20% lines are replaced by these two (spelled "Received").
  paid_received: "Received Amount (100%):- Rs. {amount}/- ({date})"
  paid_pending: "Amount Pending:- **Rs. {pending}/-**"
totals:
  gst_label: "{name} @ {rate}%:"  # one per tax row; the colon lines up with TOTAL:
saving_lines:
  - "TOTAL **SAVING** YOU DID FROM GETTING"
  - "YOUR PRINTING DONE FROM **PRINTEVR** IS"
footer:
  thanks: "THANK YOU FOR YOUR BUSINESS."
  contact_prefix: "If you have any questions, please contact us at "
  email: "Printevrventure@gmail.com"
  advance_note: "100% OF THE PAYMENT WILL BE TAKEN IN ADVANCE FOR PRINTING ORDERS"
  colour_note: "Colours can vary up to 10-20% from Digital to Print."
  late_note: "Late payment will attract additional 5% Charges"
  terms_note: "Terms & Condition applied (Refer to T&C pdf)"
  gst_note_without_gst: "Note:-  18%  gst as applicable will be extra on total"
  gst_note_with_gst: "Note:-  {gst_pct}%  gst has been added to the total"  # sum of the chosen rates
