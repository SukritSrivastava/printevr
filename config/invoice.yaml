# Invoice settings and business text (docs/BRD-cart-invoice.md section 8.5).
# Wording and spacing are copied from Printevr's own invoice on purpose, including
# "Recieved" on part-paid invoices (decision D3). `**...**` marks bold text.

# Non-GST invoices (the Printevr invoice) continue this series; quotations and GST invoices
# have their own (quotation.quote_no_start, gst_invoice.bill_no_start).
bill_no_start: 19
# GST slabs for GST invoices (BASTTA format). The only place they are defined: the cart's
# grouped "GST slab" dropdown (via GET /api/invoice-settings), the tax calculation and the
# PDF's tax rows all read this list, in this order. Rates are percentages of the taxable
# value (the pre-tax subtotal); each component is rounded to paise on its own.
# Keys are stored with saved invoices, so never reuse a key for a different rate.
gst_slab_groups:
  - key: intra
    label: "Intra-state (CGST + SGST/UTGST, IGST 0%)"
  - key: inter
    label: "Inter-state (IGST)"
gst_slabs:
  - { key: intra_5,  group: intra, label: "2.5% CGST + 2.5% SGST/UTGST (5%)", cgst: 2.5, ugst: 2.5, igst: 0 }
  - { key: intra_12, group: intra, label: "6% CGST + 6% SGST/UTGST (12%)",    cgst: 6,   ugst: 6,   igst: 0 }
  - { key: intra_18, group: intra, label: "9% CGST + 9% SGST/UTGST (18%)",    cgst: 9,   ugst: 9,   igst: 0 }
  - { key: inter_5,  group: inter, label: "5% IGST",                          cgst: 0,   ugst: 0,   igst: 5 }
  - { key: inter_12, group: inter, label: "12% IGST",                         cgst: 0,   ugst: 0,   igst: 12 }
  - { key: inter_18, group: inter, label: "18% IGST",                         cgst: 0,   ugst: 0,   igst: 18 }
# How each component is named on the GST invoice. The second intra-state component prints
# as "UGST", as on the BASTTA template.
gst_component_names: { cgst: CGST, ugst: UGST, igst: IGST }
# A buyer GSTIN starting with this state code (04 = Chandigarh) is intra-state; the cart
# warns, without blocking, when the chosen slab doesn't match.
seller_state_code: "04"
# LEGACY, for reading old records only. "With GST billing" invoices saved before the slabs
# stored one of these keys. They reprint from their stored tax rows exactly as issued;
# these are never offered for new invoices.
legacy_gst_options:
  - key: gst_5
    label: "5% GST"
    components: [{ name: GST, rate: 5 }]
  - key: gst_12
    label: "12% GST"
    components: [{ name: GST, rate: 12 }]
  - key: gst_18
    label: "18% GST"
    components: [{ name: GST, rate: 18 }]
  - key: cgst_sgst_9_9
    label: "9% CGST + 9% SGST/UTGST"
    components: [{ name: CGST, rate: 9 }, { name: SGST/UTGST, rate: 9 }]
advance_pct: 80
# What printed invoices (Non-GST and GST) say about payment. false (owner's decision, 2026-10-03):
# none of it. The Non-GST invoice prints no payment-terms box (total, advance, received, pending,
# balance) and no footer payment notes (advance_note, late_note); the GST invoice prints no
# "Payment Terms" field, no bank details and `terms_lines_without_payment` instead of
# `terms_lines`. Payments are still recorded in the app (Invoices page) and emailed to staff;
# they only stay off the PDF. true prints all of it again, exactly as before.
print_payment_details: false
pad_single_digit_unit_price: true
# No payment status in the file name either (print_payment_details is false); {status} may be
# added back to show Unpaid / Part-paid / Paid.
filename: "Invoice_{bill_no}_{business}.pdf"
status_labels: { unpaid: Unpaid, part_paid: Part-paid, paid: Paid }
# Every new invoice (Non-GST or GST) and every recorded payment is emailed here with its PDF;
# quotations are not. Sending needs SMTP_PASSWORD (a Gmail app password for SMTP_USER, which
# defaults to this address). {bill_no}, {business} and {status} are filled in in the subjects
# and intros; the `_gst` ones are used for GST invoices. The body lists the sale and its totals
# under `labels`, as HTML with a plain-text copy. Remove this block to stop the emails.
email:
  to: printevrdesk@gmail.com
  subject_new: "Invoice #{bill_no} – {business}"
  subject_payment: "Payment recorded · Invoice #{bill_no} – {business} – {status}"
  subject_new_gst: "GST Invoice #{bill_no} – {business}"
  subject_payment_gst: "Payment recorded · GST Invoice #{bill_no} – {business} – {status}"
  intro_new_gst: "New GST invoice {bill_no} for {business}."
  intro_payment_gst: "A payment was recorded on GST invoice {bill_no} for {business}. It is now {status}."
  intro_new: "New invoice {bill_no} for {business}."
  intro_payment: "A payment was recorded on invoice {bill_no} for {business}. It is now {status}."
  status_labels: { unpaid: Unpaid, part_paid: Part-paid, paid: Paid in Full }
  labels:
    customer: "Customer"
    bill_no: "Bill No"
    invoice_date: "Invoice date"
    items: "Items"
    item: "Item"
    quantity: "Qty"
    unit_price: "Unit price"
    subtotal: "Subtotal"
    total: "Total amount"
    payable: "Payable (incl. GST)"
    status: "Payment status"
    received: "Amount received"
    pending: "Amount pending"
    attached: "The invoice PDF is attached."
    currency: "Rs. "

unit_plurals: { box: boxes, bag: bags, card: cards, roll: rolls, sheet: sheets, label: labels, piece: pcs, pc: pcs, "sq ft": "sq ft" }
from_lines:
  - "#Plot no - 1795 2nd Floor,"
  - "Hallo Mazra 160002"
  - "Chandigarh"
  - "Ph- 6239645912, 7696771179"
payment_terms:
  title: "PAYMENT TERMS     ({billing_label})"
  billing_labels: { without_gst: "WITHOUT GST BILLING", with_gst: "WITH GST BILLING" }
  total: "**Total Amount:- Rs. {payable}/-**"
  advance: "**{advance_pct}% amount pending (before printing & after sample & final confirmation):-  {advance}/-**"
  received: "Recieved Amount:- Rs. {amount}/- ({date})"
  pending: "Amount Pending (out of {advance_pct}%) :- {advance}/-  (-)  {applied}/-  =  **{pending}/-**"
  balance: "{balance_pct}% Amount:- Rs. {balance}/- (Before Dispatching the Order)"
  balance_after_excess: "{balance_pct}% Amount:- Rs. {balance}/-  (-)  {excess}/-  =  **{balance_due}/-** (Before Dispatching the Order)"
  paid_in_full: "**Payment Status:- PAID IN FULL**"
  # Paid in full: the 80% / 20% lines are replaced by these two (spelled "Received").
  paid_received: "Received Amount (100%):- Rs. {amount}/- ({date})"
  paid_pending: "Amount Pending:- **Rs. {pending}/-**"
totals:
  gst_label: "{name} @ {rate}%:"  # one per tax row; the colon lines up with TOTAL:
saving_lines:
  - "TOTAL **SAVING** YOU DID FROM GETTING"
  - "YOUR PRINTING DONE FROM **PRINTEVR** IS"
footer:
  thanks: "THANK YOU FOR YOUR BUSINESS."
  contact_prefix: "If you have any questions, please contact us at "
  email: "Printevrventure@gmail.com"
  advance_note: "100% OF THE PAYMENT WILL BE TAKEN IN ADVANCE FOR PRINTING ORDERS"
  colour_note: "Colours can vary up to 10-20% from Digital to Print."
  late_note: "Late payment will attract additional 5% Charges"
  terms_note: "Terms & Condition applied (Refer to T&C pdf)"
  gst_note_without_gst: "Note:-  18%  gst as applicable will be extra on total"
  gst_note_with_gst: "Note:-  {gst_pct}%  gst has been added to the total"  # sum of the chosen rates

# ---------------------------------------------------------------- Quotation
# docs/templates/quotation.pdf: the Printevr layout with its own title and number label.
# Quotations are numbered in their own series and carry no tax, payment state or payment
# details (the template's UPI block and the footer's payment notes are left off).
quotation:
  quote_no_start: 1
  title: "QUOTATION"
  number_label: "Quote No"
  filename: "Quotation_{bill_no}_{business}.pdf"
  table_labels:
    item: "ITEM"
    quantity: "QUANTITY"
    market_price: ["MARKET", "PRICE"]
    discounted_price: ["DISCOUNTED", "PRICE"]
    subtotal: "SUBTOTAL"

# ---------------------------------------------------------------- GST invoice (BASTTA)
# docs/templates/gst_invoice.pdf. Text copied from the template, with three typos fixed:
# "orignal copy", "INVOICE N0." and "Good once sold". Numbered in its own series.
gst_invoice:
  bill_no_start: 1
  filename: "GST_Invoice_{bill_no}_{business}.pdf"
  seller_name: "BASTTA"
  seller_lines:
    - "GSTIN :- 04DYFPR0054B1ZX"
    - "Plot No 1783 Deep complex Hallo Majra Chandigarh 160002"
    - "Phone :- 6239645912"
  copy_label: "ORIGINAL COPY"
  date_label: "Date:"
  number_label: "INVOICE NO."
  buyer_heading: "Buyer Info (Billed to)"
  consignee_heading: "Consignee Info (Shipped to)"
  # Printed under a party's name and address when filled in; {value} is what was typed.
  party_phone: "Phone :- {value}"
  party_gstin: "GSTIN :- {value}"
  # Each label is followed by its value; a blank value prints blank.
  field_labels:
    delivery_terms: "Delivery Terms:- "
    payment_terms: "Payment Terms: "
    po_date: "P.O Date :-  "
    gr_rr_no: "GR/RR No: "
    transport: "Transport : "
    vehicle_no: "Vehicle no. : "
    eway_bill_no: "E-Way Bill No.  : "
    station: "Station:- "
  # What a new GST invoice's fields start as in the cart (all editable).
  field_defaults:
    payment_terms: "Advance"
    transport: "Self"
    station: "Chandigarh"
  table_labels:
    item: "ITEM"
    description: "DESCRIPTION"
    hsn: "HSN CODE"
    quantity: "QUANTITY"
    units: "UNITS"
    rate: "RATE"
    amount: "AMOUNT"
  totals:
    sub_total: "SUB-TOTAL :"
    tax: "{name} Tax ({rate}%) :"
    after_tax: "(After Tax) Sub-total :"
    total: "Total :"
  bank_lines:
    - "COMPANY NAME:- BASTTA"
    - "ICICI BANK"
    - "Account No - 108405500579"
    - "IFSC Code - ICIC0001084"
    - "SECTOR 46, CHANDIGARH 160047"
    - "PHONE:- 6239645912"
    - "GST NO :- 04DYFPR0054B1ZX"
    - "Plot No 1783 Deep complex Hallo Majra"
    - " Chandigarh 160002"
  terms_heading: "TERMS & CONDITIONS :"
  # One entry per printed line, wrapped where the template wraps them.
  terms_lines:
    - "1. Goods once sold will not be returned/ Exchanged."
    - "2. Interest will be charged @36% p.a. if bill not paid within"
    - "due date"
    - "3. Our responsibility ceases after the goods are removed"
    - "from our premises."
    - "4. All disputes subject to Chandigarh Jurisdiction."
  # Printed instead of terms_lines while print_payment_details is false: no late-payment interest.
  terms_lines_without_payment:
    - "1. Goods once sold will not be returned/ Exchanged."
    - "2. Our responsibility ceases after the goods are removed"
    - "from our premises."
    - "3. All disputes subject to Chandigarh Jurisdiction."
  certified: "Certified that the particulars given above are true & correct"
  signatory: "For BASTTA"
