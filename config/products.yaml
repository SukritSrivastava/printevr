    hsn_code: ""
    invoice_title: Customised corrugated box printing
    sale_unit: box
    custom_dims: box
    anchor_group: corrugated_boxes
    anchor_match: [option_1]
    option_labels: { option_1: Board }
    addons: *box_addons
    notes: *box_notes

  # ---------- Carry bags: Small + Medium + Large pool together ----------
