# Printevr product config — everything about a product except its prices.
# Prices live only in data/Printevr_Pricing_Master_2025-26.xlsx (from the October 2026 catalogue).
# `product` must match the Master "Product" column exactly.
# `hsn_code` pre-fills the HSN CODE column on GST invoices (staff can edit it per line). Every
# product starts blank on purpose: enter the real code from your GST records, never a guess.

defaults:
  gst_rate: 0.18
  below_min_policy: bill_at_min      # or: block
  custom_round_step: 0.50
  custom_surcharge_pct: 0            # decision D3
  flagged_price_policy: warn         # or: block (decision D6)
  show_invoice_billing: false        # decision D5: hidden in the UI until accounts confirms
  suggest_more: true
  slider_max_multiplier: 2          # tier slider ends at top tier x this, unless max_qty is set
  size_label: Size
  notes:
    - Delivery and design charges extra
    - 100% advance for custom printing orders
    - Colours may vary 10-20% from screen to print
    - Prices from the 2025-26 catalogue

addon_library:
  round_edges:    { name: Round edges,          price: 1,    basis: per_unit }
  multicolour:    { name: Multicolour print,    price: 1000, basis: per_order }   # basis assumed, flag F24 (D8)
  custom_cut:     { name: Custom size cut,      price: 500,  basis: per_order }   # basis assumed
  golden_special: { name: Special golden print, price: 500,  basis: per_order }   # basis assumed
  half_stitching: { name: Half stitching and cutting, price: 800, basis: per_order } # basis assumed
  golden_print:   { name: Golden colour print,  price: 5,    basis: per_unit }
  black_zipper:   { name: Black zipper,         price: 5,    basis: per_unit }
  sample:         { name: Sample,               price: from_sheet, basis: per_order }
  # Box add-ons (catalogue pages 16-22). `percent` = that share of the line's unit price.
  inlet:          { name: Inlet (+20% of box price),         percent: 20, basis: per_unit }
  premium_inlet:  { name: Premium inlet (+25% of box price), percent: 25, basis: per_unit }
  gold_foiling:   { name: Gold foiling,         price: 4000, basis: per_order }   # "extra on the total order"
  embossing:      { name: Embossing,            price: 6000, basis: per_order }
  debossing:      { name: Debossing,            price: 6000, basis: per_order }

products:
  # ---------- Ribbons ----------
  - product: Customised Ribbon - Single Colour
    id: ribbon_single_colour
    hsn_code: ""
    invoice_title: Customised single colour ribbon printing
    sale_unit: roll
    yield_factor: 180
    micro_uom: per metre
    micro_unit: m
    custom_dims: none
    size_label: Width
    option_labels: { option_1: Roll length }
  - product: Customised Ribbon - Multi Colour
    id: ribbon_multi_colour
    hsn_code: ""
    invoice_title: Customised multi colour ribbon printing
    sale_unit: roll
    yield_factor: 180
    micro_uom: per metre
    micro_unit: m
    custom_dims: none
    size_label: Width
    option_labels: { option_1: Roll length }
  - product: Customised Ribbon - Gold / Silver Foil
    id: ribbon_foil
    hsn_code: ""
    invoice_title: Customised gold / silver foil ribbon printing
    sale_unit: roll
    yield_factor: 180
    micro_uom: per metre
    micro_unit: m
    custom_dims: none
    size_label: Width
    option_labels: { option_1: Roll length }
  - product: Customised Ribbon - Grosgrain (printed as 'Gross Grain')
    id: ribbon_grosgrain
    hsn_code: ""
    invoice_title: Customised grosgrain ribbon printing
    display_name: Customised Ribbon - Grosgrain
    sale_unit: roll
    yield_factor: 90
    micro_uom: per metre
    micro_unit: m
    custom_dims: none
    size_label: Width
    option_labels: { option_1: Roll length }
  - product: Customised Ribbon - Cotton
    id: ribbon_cotton
    hsn_code: ""
    invoice_title: Customised cotton ribbon printing
    sale_unit: roll
    yield_factor: 180
    micro_uom: per metre
    micro_unit: m
    custom_dims: none
    size_label: Width
    option_labels: { option_1: Roll length }

  # ---------- Cloth labels ----------
  - product: Silk Cloth Labels
    id: labels_silk
    hsn_code: ""
    invoice_title: Customised silk cloth label printing
    sale_unit: roll
    yield_factor: 2000          # decision D9: catalogue says 2,000-2,500
    micro_uom: per label
    micro_unit: labels
    micro_approx: true
    custom_dims: none
    size_label: Width
    option_labels: { option_1: Roll length }
    addons: [half_stitching]
  - product: Cotton Cloth Labels
    id: labels_cotton
    hsn_code: ""
    invoice_title: Customised cotton cloth label printing
    sale_unit: roll
    yield_factor: 2000
    micro_uom: per label
    micro_unit: labels
    micro_approx: true
    custom_dims: none
    size_label: Width
    option_labels: { option_1: Roll length }
    addons: [half_stitching]

  # ---------- Outdoor ----------
  - product: Outdoor Branding
    id: outdoor_branding
    hsn_code: ""
    invoice_title: Customised outdoor branding printing
    sale_unit: sq ft
    custom_dims: area_sqft      # UI multiplies width x height x pieces into quantity
    size_label: Material
    suggest_more: false         # FR-3.4
    notes:
      - Tiers are based on total order square feet (decision D7)

  # ---------- Visiting cards ----------
  - product: Standard Visiting Cards
    id: vc_standard
    hsn_code: ""
    invoice_title: Customised standard visiting card printing
    sale_unit: card
    custom_dims: none
    size_label: Paper
    option_labels: { option_1: Lamination, option_2: Printing }
    addons: [round_edges]
    notes: [Custom card size / shape cut priced on discussion]
  - product: Raised Foil Visiting Cards
    id: vc_raised_foil
    hsn_code: ""
    invoice_title: Customised raised foil visiting card printing
    sale_unit: card
    custom_dims: none
    size_label: Paper
    option_labels: { option_1: Lamination, option_2: Printing }
    addons: [round_edges]
    notes: [Custom card size / shape cut priced on discussion]
  - product: Textured Visiting Cards
    id: vc_textured
    hsn_code: ""
    invoice_title: Customised textured visiting card printing
    sale_unit: card
    custom_dims: none
    size_label: Paper
    option_labels: { option_1: Lamination, option_2: Printing }
    addons: [round_edges]
    notes: [Custom card size / shape cut priced on discussion]
  - product: Spot UV Visiting Cards
    id: vc_spot_uv
    hsn_code: ""
    invoice_title: Customised spot UV visiting card printing
    sale_unit: card
    custom_dims: none
    size_label: Paper
    option_labels: { option_1: Lamination, option_2: Printing }
    addons: [round_edges]
    notes: [Custom card size / shape cut priced on discussion]

  # ---------- ID cards ----------
  - product: Customised ID Cards
    id: id_cards
    hsn_code: ""
    invoice_title: Customised ID card printing
    sale_unit: pc
    custom_dims: none
    size_label: Item

  # ---------- Butter paper ----------
  - product: Customised Butter Paper
    id: butter_paper
    hsn_code: ""
    invoice_title: Customised butter paper printing
    sale_unit: sheet
    custom_dims: flat
    anchor_group: butter_paper
    anchor_match: []
    addons: [multicolour, custom_cut, golden_special]

  # ---------- Sticker sheets ----------
  - product: Customised Sticker Sheets
    id: sticker_sheets
    hsn_code: ""
    invoice_title: Customised sticker sheet printing
    sale_unit: sheet
    custom_dims: none
    size_label: Material
    max_qty: 1000
    addons: [sample]

  # ---------- Page 15 cards (flags F9, F10) ----------
  - product: Untitled cards (pg 15) - table A
    id: cards_pg15_a
    hsn_code: ""
    invoice_title: Customised card printing
    sale_unit: card
    custom_dims: none
    option_labels: { option_1: Finish }
  - product: Untitled cards (pg 15) - table B
    id: cards_pg15_b
    hsn_code: ""
    invoice_title: Customised card printing
    sale_unit: card
    custom_dims: none
    option_labels: { option_1: Finish }

  # ---------- Boxes ----------
  - product: Monocarton Boxes
    id: monocarton_boxes
    hsn_code: ""
    invoice_title: Customised monocarton box printing
    sale_unit: box
    custom_dims: box
    anchor_group: monocarton_boxes
    anchor_match: [option_1]
    option_labels: { option_1: Box type }
    addons: &box_addons [inlet, premium_inlet, gold_foiling, embossing, debossing]
    notes: &box_notes ["Custom size, material, shape, inside printing and premium formations on discussion"]
  - product: Rigid Boxes
    id: rigid_boxes
    hsn_code: ""
    invoice_title: Customised rigid box printing
    sale_unit: box
    custom_dims: box
    anchor_group: rigid_boxes
    anchor_match: [option_1]
    option_labels: { option_1: Box type }
    addons: *box_addons
    notes: *box_notes
  # Second rigid-box table (pages 19-20, untitled, priced to 2,500): its own product so custom
  # sizes are priced from its own tiers (anchor groups must share breakpoints). Flag F28.
  - product: Rigid Boxes (up to 2,500)
    id: rigid_boxes_2500
    hsn_code: ""
    invoice_title: Customised rigid box printing
    sale_unit: box
    custom_dims: box
    anchor_group: rigid_boxes_2500
    anchor_match: [option_1]
    option_labels: { option_1: Box type }
    addons: *box_addons
    notes: *box_notes
  - product: Corrugated Boxes
